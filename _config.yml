title: KB0RB
callsign: KB0RB
owner: Jon
tagline: Amateur Radio Operator
description: >-
  KB0RB is Jon, a US Amateur Extra class ham in Vacaville, California
  (grid CM98aj), carrying on a family tradition of amateur radio.
url: https://kb0rb.net
baseurl: ""
lang: en
timezone: America/Los_Angeles

author:
  name: Jon (KB0RB)
  email: qso@kb0rb.net

social:
  name: Jon (KB0RB)
  links:
    - https://www.qrz.com/db/kb0rb

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

permalink: pretty
sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# No `twitter:` block on purpose. Adding one makes jekyll-seo-tag emit
# `twitter:site` as a bare "@" and derive `twitter:creator` from the author's
# display name unless a real handle is set. Without it, the card type is still
# inferred correctly from the image below.

# jekyll-seo-tag only reads `image` from a page, never from `site`, so the
# site-wide social card has to be applied as a default. Pages that want their
# own card (a project page, say) just set `image:` in their front matter.
#
# Never put `layout` in here: these defaults also apply to assets/css/main.css
# and robots.txt, which would then be wrapped in HTML.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-image.jpg

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
  - node_modules
  - scripts
