  - jekyll-sitemap

# Every page sets its own layout explicitly — a `defaults` block here would also
# wrap assets/css/main.css and robots.txt in a layout.

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
  - node_modules
  - scripts
