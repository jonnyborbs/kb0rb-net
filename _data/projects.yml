# Ordered as they appear on /projects/ and on the home page.
#
# Each project needs a destination for its card. Either:
#   `url`  — the project's own website, opened in a new tab, or
#   `page` — a local detail page under projects/ (used when there is no
#            dedicated site to send people to).
# Don't set both: the site should never hold a second copy of information
# that already lives on a project's own site.

- name: Greyline FT8
  slug: greyline-ft8
  icon_image: /assets/img/greyline-ft8-icon.png
  tagline: FT8 and FT4 digital modes for iPhone and iPad
  summary: >-
    A full-featured digital mode app that runs FT8 and FT4 straight from an
    iPhone or iPad. Features a live waterfall, automated QSO modes, POTA activations,
    spot maps and logging. All with no heavy laptop in the field.
  url: https://greylineft8.com
  url_label: greylineft8.com
  appstore: https://apps.apple.com/app/greyline-ft8/id6773455172

- name: AllStar Node Control
  slug: allstar-node-control
  icon_image: /assets/img/node-control-icon.png
  tagline: Manage your AllStarLink node from your pocket
  summary: >-
    An iOS app for operating your AllStarLink nodes. Node Control lets you connect and 
    disconnect links, watch node status, and keep your favourite nodes a tap away. Configure
    custom node macros and so much more.
  page: /projects/allstar-node-control/
  status: Coming soon to the App Store
  links:
    - title: App Privacy Policy
      url: /projects/allstar-node-control/privacy/

- name: We Have Wine at Home!
  slug: we-have-wine-at-home
  icon_image: /assets/img/wine-at-home-icon.png
  tagline: A visual cellar for the wine, beer and spirits you already own
  summary: >-
    An iPhone and iPad app for cataloguing your home bar collection. Create and 
    configure virtual wine cellars, add photos, track styles, quantities, locations, 
    prices and more. CSV import and export keeps you in control of your data. Fully free. 
    No accounts, no ads, no subscriptions.
  url: https://wehavewineathome.app
  url_label: wehavewineathome.app
  appstore: https://apps.apple.com/app/we-have-wine-at-home/id6775716751